name: Publish

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish.yml'
      - 'adapters/**'
      - 'messages/**'
      - 'public/**'
      - 'src/**'
      - '*.config.*js'
      - '*.config.*ts'
      - 'wrangler.json*'
      - 'package*.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
      url: https://cfodpa.demosjarco.dev
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo-and-containers: true
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          check-latest: true
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run-script install --if-present
      - name: Restore TS cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/.tsbuildinfo
          key: tsc-${{ hashFiles('tsconfig.json', 'package-lock.json', 'wrangler.json', '*.d.ts', '*.config.ts', 'src/**', 'helpers/**', 'adapters/**') }}
          restore-keys: |
            tsc-
          enableCrossOsArchive: true
      - run: npm run build.types
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/.tsbuildinfo
          key: tsc-${{ hashFiles('tsconfig.json', 'package-lock.json', 'wrangler.json', '*.d.ts', '*.config.ts', 'src/**', 'helpers/**', 'adapters/**') }}
          enableCrossOsArchive: true
        background: true
      # Server output depends on the client manifest, so its key is a superset of the client inputs. The server build also writes into `dist/` (`_routes.json`, `_worker.js`, SSG output), so it caches the final `dist` too. A server hit therefore restores everything and skips both builds.
      - name: Restore server cache
        id: server-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist
            server
            src/paraglide
          key: qwik-s-${{ hashFiles('package-lock.json', 'tsconfig.json', 'vite.config.ts', 'project.inlang/settings.json', 'messages/**', 'public/**', 'src/**', 'adapters/**') }}
          enableCrossOsArchive: true
      - name: Restore client cache
        id: client-cache
        if: steps.server-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist
            src/paraglide
          key: qwik-c-${{ hashFiles('package-lock.json', 'tsconfig.json', 'vite.config.ts', 'project.inlang/settings.json', 'messages/**', 'public/**', 'src/**') }}
          enableCrossOsArchive: true
      - run: npm run build.client
        if: steps.server-cache.outputs.cache-hit != 'true' && steps.client-cache.outputs.cache-hit != 'true'
      # Type-aware lint needs `src/paraglide`, which exists from here on (cache restore or build.client). build.server doesn't rewrite it ("inputs unchanged") & lint ignores `dist/*` & `server/*`, so it can overlap the server build. Gated by `wait` before deploy
      - run: npm run lint
        id: lint
        background: true
      # Not in background: build.server writes into `dist/` and would race the archive
      - name: Save client cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist
            src/paraglide
          key: qwik-c-${{ hashFiles('package-lock.json', 'tsconfig.json', 'vite.config.ts', 'project.inlang/settings.json', 'messages/**', 'public/**', 'src/**') }}
          enableCrossOsArchive: true
      - run: npm run build.server
        if: steps.server-cache.outputs.cache-hit != 'true'
      - name: Save server cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist
            server
            src/paraglide
          key: qwik-s-${{ hashFiles('package-lock.json', 'tsconfig.json', 'vite.config.ts', 'project.inlang/settings.json', 'messages/**', 'public/**', 'src/**', 'adapters/**') }}
          enableCrossOsArchive: true
        background: true
      - run: npm run verify:no-react
      - wait: lint
      - run: echo "wrangler_version=$(npm ls wrangler --depth=0 --json | jq -r '.dependencies.wrangler.version')" >> $GITHUB_OUTPUT
        id: npm_wrangler_version
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        id: wrangler
        with:
          wranglerVersion: ${{ steps.npm_wrangler_version.outputs.wrangler_version }}
          apiToken: ${{ secrets.WORKER_DEPLOY_CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          vars: |
            GIT_HASH
          secrets: |
            AUTH_SECRET
            CF_OAUTH_SECRET
        env:
          GIT_HASH: ${{ github.sha }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CF_OAUTH_SECRET: ${{ secrets.CF_OAUTH_SECRET }}
